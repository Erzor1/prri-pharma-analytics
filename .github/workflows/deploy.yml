name: CI & Auto-Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ci-test:
    name: Validate ETL, SQL Views & Dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify syntax and run smoke pipeline on sample data
        run: |
          python -m py_compile src/scraper.py src/cleaner.py src/database.py src/stats_tests.py src/pipeline.py app.py
          python -m src.cleaner --input data/raw/sample_100.csv --output-cleaned data/processed/rzn_cleaned.csv --output-mfg data/processed/manufacturers_prri.csv
          python -m src.database

  deploy-vps:
    name: Deploy Docker Compose Stack to VPS
    needs: ci-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to Production VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            APP_DIR="${{ secrets.VPS_APP_DIR || '/opt/prri-analytics' }}"
            if [ ! -d "$APP_DIR" ]; then
              mkdir -p "$APP_DIR"
              git clone https://github.com/${{ github.repository }}.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build --remove-orphans
            docker image prune -f
